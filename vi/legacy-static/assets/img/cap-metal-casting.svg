<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Metal Casting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A33"/>
      <stop offset="1" stop-color="#0C141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="rgba(47,127,166,.24)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="63" height="63" patternUnits="userSpaceOnUse">
      <path d="M 63 0 L 0 0 0 63" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g stroke="rgba(255,255,255,.10)" stroke-width="1" fill="none">
    <circle cx="888" cy="330" r="225"/>
    <circle cx="888" cy="330" r="150"/>
    <circle cx="888" cy="330" r="75"/>
  </g>
  <g stroke="rgba(242,106,27,.55)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 663 330 h 75"/>
    <path d="M 1038 330 h 75"/>
    <path d="M 888 105 v 75"/>
  </g>

  <rect x="72" y="465" width="4" height="150" fill="#F26A1B"/>
  <text x="94" y="510"
        font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21"
        letter-spacing="4.5" fill="#8C9EAC">GRG POLYDYNAMICS</text>
  <text x="94" y="585"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="47" letter-spacing="-1" fill="#FFFFFF">Metal Casting</text>
</svg>
