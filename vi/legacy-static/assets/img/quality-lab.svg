<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Quality Inspection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212A"/>
      <stop offset="1" stop-color="#0A0F13"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0" stop-color="rgba(242,106,27,.22)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M 75 0 L 0 0 0 75" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <g stroke="rgba(255,255,255,.10)" stroke-width="1" fill="none">
    <circle cx="888" cy="396" r="270"/>
    <circle cx="888" cy="396" r="180"/>
    <circle cx="888" cy="396" r="90"/>
  </g>
  <g stroke="rgba(242,106,27,.55)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 618 396 h 90"/>
    <path d="M 1068 396 h 90"/>
    <path d="M 888 126 v 90"/>
  </g>

  <rect x="72" y="558" width="4" height="180" fill="#F26A1B"/>
  <text x="94" y="612"
        font-family="ui-monospace, Menlo, Consolas, monospace" font-size="25"
        letter-spacing="5.4" fill="#8C9EAC">GRG POLYDYNAMICS</text>
  <text x="94" y="702"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="56" letter-spacing="-1" fill="#FFFFFF">Quality Inspection</text>
</svg>
